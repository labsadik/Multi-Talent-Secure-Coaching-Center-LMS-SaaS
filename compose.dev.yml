services:
  mongo:
    image: mongo:7
    container_name: newage-mongodb-dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - newage-mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

volumes:
  newage-mongodb-data:
